name: Fetch site assets

on:
  push:
    paths:
      - ".github/workflows/fetch-site-assets.yml"

permissions:
  contents: write

jobs:
  fetch-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download official logos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets

          curl --fail --location --retry 3 \
            "https://ml3.yonsei.ac.kr/assets/img/ml3_logo_final.png" \
            --output assets/ml3_logo_final.png

          curl --fail --location --retry 3 \
            "https://www.yonsei.ac.kr/sites/en_sc/images/sub/img-symbol6.png" \
            --output assets/yonsei_symbol.png

          test -s assets/ml3_logo_final.png
          test -s assets/yonsei_symbol.png

      - name: Point homepage to local assets
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")
          html = html.replace(
              "https://www.yonsei.ac.kr/sites/en_sc/images/sub/img-symbol6.png",
              "/assets/yonsei_symbol.png",
          )
          html = html.replace(
              "https://ml3.yonsei.ac.kr/assets/img/ml3_logo_final.png",
              "/assets/ml3_logo_final.png",
          )
          path.write_text(html, encoding="utf-8")

      - name: Commit assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/
          git diff --cached --quiet && exit 0
          git commit -m "Serve site logos from local assets"
          git push origin main
